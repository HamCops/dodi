[project]
name = "espn-mcp"
version = "0.1.0"
description = "MCP server for an ESPN fantasy football league: draft, weekly lineups, waivers, trades, and the roster moves themselves"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.45"]  # scripts/live_draft.py, autodraft.py, draft_player.py, sync_from_room.py

[project.scripts]
espn-mcp = "espn_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/espn_mcp"]
